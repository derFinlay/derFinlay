<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" role="img" aria-label="Terminal: whoami — Finlay Sandy Gress — Platform Engineer &amp; automation enthusiast">
<style>
    text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre}
    .c{animation:show .01s steps(1) both}
    .out{animation:show .01s steps(1) 1.15s both}
    .l3{animation:show .01s steps(1) 1.55s both}
    .cur1{opacity:0;animation:on .01s steps(1) .18s forwards,
      mv .66s steps(6,end) .2s forwards,off .01s steps(1) 1.1s forwards}
    .cur2{animation:blink 1.2s steps(1) 1.6s infinite both}
    @keyframes show{from{opacity:0}to{opacity:1}}
    @keyframes on{to{opacity:1}}
    @keyframes off{to{opacity:0}}
    @keyframes mv{from{transform:translateX(0)}to{transform:translateX(50.4px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important}.cur1{opacity:0}}
    </style>
<rect x="1.5" y="1.5" width="877" height="145" rx="8" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<line x1="1.5" y1="34" x2="878.5" y2="34" stroke="#3d444d" stroke-width="1"/>
<text x="440" y="22" text-anchor="middle" fill="#848d97" xml:space="preserve">finlay@arch — zsh</text>
<text x="28" y="64" xml:space="preserve"><tspan fill="#848d97" textLength="92.4" lengthAdjust="spacingAndGlyphs">finlay@arch</tspan><tspan fill="#3d444d" textLength="8.4" lengthAdjust="spacingAndGlyphs">:</tspan><tspan fill="#848d97" textLength="8.4" lengthAdjust="spacingAndGlyphs">~</tspan><tspan fill="#e6edf3" textLength="16.8" lengthAdjust="spacingAndGlyphs">$ </tspan><tspan class="c" style="animation-delay:0.20s" fill="#e6edf3" textLength="8.4" lengthAdjust="spacingAndGlyphs">w</tspan><tspan class="c" style="animation-delay:0.31s" fill="#e6edf3" textLength="8.4" lengthAdjust="spacingAndGlyphs">h</tspan><tspan class="c" style="animation-delay:0.42s" fill="#e6edf3" textLength="8.4" lengthAdjust="spacingAndGlyphs">o</tspan><tspan class="c" style="animation-delay:0.53s" fill="#e6edf3" textLength="8.4" lengthAdjust="spacingAndGlyphs">a</tspan><tspan class="c" style="animation-delay:0.64s" fill="#e6edf3" textLength="8.4" lengthAdjust="spacingAndGlyphs">m</tspan><tspan class="c" style="animation-delay:0.75s" fill="#e6edf3" textLength="8.4" lengthAdjust="spacingAndGlyphs">i</tspan></text>
<rect class="cur1" x="154" y="51" width="8.4" height="17" fill="#e6edf3"/>
<text class="out" x="28" y="90" fill="#e6edf3" xml:space="preserve">Finlay Sandy Gress — Platform Engineer &amp; automation enthusiast</text>
<g class="l3"><text x="28" y="116" xml:space="preserve"><tspan fill="#848d97" textLength="92.4" lengthAdjust="spacingAndGlyphs">finlay@arch</tspan><tspan fill="#3d444d" textLength="8.4" lengthAdjust="spacingAndGlyphs">:</tspan><tspan fill="#848d97" textLength="8.4" lengthAdjust="spacingAndGlyphs">~</tspan><tspan fill="#e6edf3" textLength="16.8" lengthAdjust="spacingAndGlyphs">$ </tspan></text>
<rect class="cur2" x="154" y="103" width="8.4" height="17" fill="#e6edf3"/></g>
</svg>
